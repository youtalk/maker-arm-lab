[project]
name = "maker-arm-lab"
version = "0.1.0"
description = "Research layer for the MakerMods Maker Arm: identification, model learning, gated milestone experiments"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["source/maker_arm_lab"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["source", "tests"]
